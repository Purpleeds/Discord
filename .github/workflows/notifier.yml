# Builds the Chat Notifier for Windows (desktop/) on a real Windows machine,
# starts the built .exe as a smoke test, and keeps the installers as
# downloads on the run. Publishing a GitHub release ("notifier-v<version>",
# which the app checks for updates) only happens when asked: Actions > Chat
# Notifier > Run workflow (release ticked), or by pushing a notifier-v* tag.
name: Chat Notifier (Windows)

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/notifier.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/notifier.yml']
    tags: ['notifier-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish it as a GitHub release (notifier-v<version from desktop/package.json>)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Logic tests
        run: npm test
      - name: Build the installer and portable .exe
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Update files are there (latest.yml, app-update.yml)
        run: test -s dist/latest.yml && test -s "dist/win-unpacked/resources/app-update.yml" && cat dist/latest.yml
      - name: Start the built app (smoke test)
        run: node test/smoke-packaged.js "dist/win-unpacked/Chat Notifier.exe"
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Windows version
        shell: pwsh
        run: Get-ComputerInfo -Property OsName, OsVersion, OsBuildNumber | Format-List
      - name: Install it like people do (double-click x5, portable, start by hand, sign-in start, update from 1.1.0)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force old | Out-Null
          Invoke-WebRequest -Uri https://github.com/Purpleeds/Discord/releases/download/notifier-v1.1.0/Chat-Notifier-Setup-1.1.0.exe -OutFile old/Chat-Notifier-Setup-1.1.0.exe
          ./test/install-test.ps1 -NewSetup "dist/Chat-Notifier-Setup-${{ steps.version.outputs.version }}.exe" -NewVersion "${{ steps.version.outputs.version }}" -OldSetup old/Chat-Notifier-Setup-1.1.0.exe
      # The Microsoft Store package. Its identity comes from Partner Center >
      # the app > Product identity, saved as repository variables
      # (Settings > Secrets and variables > Actions > Variables):
      # MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_NAME.
      # Without them it's built with placeholders (fine for testing, not for upload).
      - name: Build the Microsoft Store package (.appx, unsigned - the Store signs it)
        env:
          IDENTITY: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MSSTORE_PUBLISHER_NAME }}
        run: |
          args=()
          [ -n "$IDENTITY" ] && args+=("-c.appx.identityName=$IDENTITY")
          [ -n "$PUBLISHER" ] && args+=("-c.appx.publisher=$PUBLISHER")
          [ -n "$PUBLISHER_NAME" ] && args+=("-c.appx.publisherDisplayName=$PUBLISHER_NAME")
          [ -z "$IDENTITY" ] && echo "::warning::Store identity variables aren't set - built with placeholders, not ready to upload"
          npx electron-builder --win appx --x64 --publish never "${args[@]}"
          ls -la dist/*.appx
      - name: Install and start the Store package (test-signed copy)
        shell: pwsh
        run: ./test/store-test.ps1 -Package (Get-ChildItem dist/*-store.appx | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: chat-notifier-store-${{ steps.version.outputs.version }}
          path: desktop/dist/*-store.appx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chat-notifier-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/Chat-Notifier-Setup-*.exe
            desktop/dist/Chat-Notifier-Setup-*.exe.blockmap
            desktop/dist/Chat-Notifier-*-portable.exe
            desktop/dist/latest.yml
            desktop/dist/smoke/*.png
          if-no-files-found: error

  release:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/notifier-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "notifier-v$v" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match desktop/package.json version $v"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: chat-notifier-${{ steps.version.outputs.version }}
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: notifier-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Chat Notifier ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            out/Chat-Notifier-Setup-*.exe
            out/Chat-Notifier-Setup-*.exe.blockmap
            out/Chat-Notifier-*-portable.exe
            out/latest.yml
          body: |
            Desktop pop-ups for the chat, from the system tray (Windows 10/11, 64-bit).

            **Install:** download `Chat-Notifier-Setup-${{ steps.version.outputs.version }}.exe` and run it. It installs for your account only (no admin needed), starts, and asks you to sign in. Or use the `portable` .exe, which runs without installing.

            **"Windows protected your PC"?** The app isn't code-signed, so SmartScreen warns the first time: click **More info** → **Run anyway**.

            **Installer closed without doing anything?** Installers before 1.2.0 could crash on Windows 11 24H2 when opened; this one is built with a newer NSIS and is tested by double-clicking it on that Windows build. If yours still doesn't open, the log is in `%APPDATA%\Chat Notifier\notifier.log`.

            From 1.1.0 the installed app updates itself (Settings > Update automatically). The portable .exe offers new versions from its tray icon instead.
