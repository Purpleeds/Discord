# The chat on a NAS: app + database + public address + call relay.
# Paste into the NAS's Docker app (Project > Create, name it "chat") and fill
# in the settings below. Guide: deploy/nas/README.md
name: chat

x-settings:
  db-password: &db_password "CHANGE-ME-letters-and-numbers"
  neon-url: &neon_url ""
  tailscale-key: &ts_key "tskey-auth-PASTE-YOURS"

services:
  db:
    image: postgres:18
    container_name: chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: *db_password
      POSTGRES_DB: chat
    volumes:
      - chat-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Copies everything from Neon once, while the database is still empty.
  import:
    image: postgres:18
    container_name: chat-import
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEON_URL: *neon_url
      PGHOST: db
      PGUSER: chat
      PGDATABASE: chat
      PGPASSWORD: *db_password
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$NEON_URL" ]; then echo "No Neon address - nothing to copy."; exit 0; fi
        tries=0
        until psql -tAc "SELECT 1" >/dev/null 2>&1; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 60 ]; then echo "Database never came up."; exit 1; fi
          sleep 2
        done
        if [ "$$(psql -tAc "SELECT to_regclass('public.users') IS NOT NULL")" = "t" ]; then echo "Database already has data - nothing to copy."; exit 0; fi
        pg_dump --no-owner --no-privileges "$$NEON_URL" > /tmp/neon.sql || { echo "Could not read from Neon."; exit 1; }
        psql -v ON_ERROR_STOP=1 -q < /tmp/neon.sql > /dev/null || { echo "Could not load the copy."; exit 1; }
        echo "Copied: $$(psql -tAc "SELECT count(*) FROM users") accounts, $$(psql -tAc "SELECT count(*) FROM messages") messages."

  # The chat. Downloads the latest version every time it starts.
  chat:
    image: node:22-alpine
    container_name: chat
    restart: unless-stopped
    depends_on:
      import:
        condition: service_completed_successfully
    ports:
      - "8080:3000"
    environment:
      PGHOST: db
      PGUSER: chat
      PGDATABASE: chat
      PGPASSWORD: *db_password
      PGSSL: "false"
      PORT: "3000"
      NODE_ENV: production
      DATA_DIR: /data
      KEEP_FILE_MB: "25"
      MEDIA_BUDGET_MB: "40000"
      FILE_EXPIRY_HOURS: "720"
      CODE_URL: https://codeload.github.com/Purpleeds/Discord/tar.gz/refs/heads/main
      # calls on strict networks use the relay below ({host} = the public name)
      TURN_URLS: "turns:{host}:8443?transport=tcp"
      TURN_SECRET_FILE: /shared/turn-secret
    volumes:
      - chat-code:/app
      - chat-files:/data
      - turn-shared:/shared
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        [ -s /shared/turn-secret ] || head -c 32 /dev/urandom | base64 > /shared/turn-secret
        chmod 644 /shared/turn-secret
        if wget -qO /tmp/code.tgz "$$CODE_URL"; then
          rm -rf /tmp/code && mkdir -p /tmp/code
          tar xzf /tmp/code.tgz -C /tmp/code --strip-components=1
          cp -r /tmp/code/. /app/
          npm ci --omit=dev --no-audit --no-fund --loglevel=error
        elif [ ! -f /app/server.js ]; then
          echo "Could not download the app."; exit 1
        fi
        exec node server.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 180s

  # TURN relay for calls when two people can't connect directly. Reached
  # through Funnel on port 8443 (TLS ends there), so no router changes. It
  # may only relay between callers, never into your home network.
  turn:
    image: coturn/coturn:latest
    container_name: chat-turn
    restart: unless-stopped
    user: root
    depends_on:
      - chat
    volumes:
      - turn-shared:/shared:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while [ ! -s /shared/turn-secret ]; do sleep 2; done
        SELF=$$(hostname -i | awk '{print $$1}')
        exec turnserver -n --log-file=stdout --no-cli --no-tls --no-dtls --listening-port=3478 \
          --fingerprint --use-auth-secret --static-auth-secret="$$(cat /shared/turn-secret)" --realm=chat \
          --min-port=49160 --max-port=49260 --no-multicast-peers --total-quota=40 --max-bps=2500000 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --allowed-peer-ip=$$SELF

  # Publishes the chat (443) and the call relay (8443) with Tailscale Funnel.
  funnel:
    image: tailscale/tailscale:latest
    container_name: chat-funnel
    hostname: discord
    restart: unless-stopped
    depends_on:
      - chat
    environment:
      TS_AUTHKEY: *ts_key
      TS_HOSTNAME: discord
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - funnel-state:/var/lib/tailscale
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /config
        cat > /config/serve.json <<'JSON'
        {"TCP":{"443":{"HTTPS":true},"8443":{"TCPForward":"turn:3478","TerminateTLS":"$${TS_CERT_DOMAIN}"}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://chat:3000"}}}},"AllowFunnel":{"$${TS_CERT_DOMAIN}:443":true,"$${TS_CERT_DOMAIN}:8443":true}}
        JSON
        exec /usr/local/bin/containerboot

volumes:
  chat-db:
  chat-code:
  chat-files:
  funnel-state:
  turn-shared:
