# The chat on a NAS: app + database + public address + call relay + call
# media server (for group calls and voice channels of up to 25 people).
# Paste into the NAS's Docker app (Project > Create, name it "chat") and fill
# in the settings below. Guide: deploy/nas/README.md
name: chat

x-settings:
  db-password: &db_password "CHANGE-ME-letters-and-numbers"
  neon-url: &neon_url ""
  tailscale-key: &ts_key "tskey-auth-PASTE-YOURS"
  # Discord bridge (optional, DISCORD_BRIDGE.md): leave empty to keep it off
  discord-bot-token: &discord_token ""
  discords-bridge-key: &bridge_key ""

services:
  db:
    image: postgres:18
    container_name: chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: *db_password
      POSTGRES_DB: chat
    volumes:
      - chat-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Copies everything from Neon once, while the database is still empty.
  import:
    image: postgres:18
    container_name: chat-import
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups:ro
    environment:
      NEON_URL: *neon_url
      PGHOST: db
      PGUSER: chat
      PGDATABASE: chat
      PGPASSWORD: *db_password
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$NEON_URL" ]; then echo "No Neon address - nothing to copy."; exit 0; fi
        tries=0
        until psql -tAc "SELECT 1" >/dev/null 2>&1; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 60 ]; then echo "Database never came up."; exit 1; fi
          sleep 2
        done
        if [ "$$(psql -tAc "SELECT to_regclass('public.users') IS NOT NULL")" = "t" ]; then echo "Database already has data - nothing to copy."; exit 0; fi
        # a lost or new disk with backups: the chat restores the newest backup itself, not old Neon data
        if ls /backups/snapshots/*/manifest.json >/dev/null 2>&1; then echo "Backups found - the chat restores the newest one itself."; exit 0; fi
        pg_dump --no-owner --no-privileges "$$NEON_URL" > /tmp/neon.sql || { echo "Could not read from Neon."; exit 1; }
        psql -v ON_ERROR_STOP=1 -q < /tmp/neon.sql > /dev/null || { echo "Could not load the copy."; exit 1; }
        echo "Copied: $$(psql -tAc "SELECT count(*) FROM users") accounts, $$(psql -tAc "SELECT count(*) FROM messages") messages."

  # The chat. Downloads the latest version every time it starts.
  chat:
    image: node:22-alpine
    container_name: chat
    restart: unless-stopped
    depends_on:
      import:
        condition: service_completed_successfully
    ports:
      - "8080:3000"
    environment:
      PGHOST: db
      PGUSER: chat
      PGDATABASE: chat
      PGPASSWORD: *db_password
      PGSSL: "false"
      PORT: "3000"
      NODE_ENV: production
      DATA_DIR: /data
      KEEP_FILE_MB: "25"
      MEDIA_BUDGET_MB: "40000"
      FILE_EXPIRY_HOURS: "720"
      CODE_REPO: Purpleeds/Discord
      # checks GitHub every 3 minutes and restarts itself on a new version
      # (waits while anyone is in a call); remove to update only on restart
      AUTO_UPDATE_REPO: Purpleeds/Discord
      # visits the Render address every minute so its free plan never sleeps
      KEEPALIVE_URL: https://discords-zf2n.onrender.com/healthz
      # calls on strict networks use the relay below ({host} = the public name)
      TURN_URLS: "turns:{host}:8443?transport=tcp"
      TURN_SECRET_FILE: /shared/turn-secret
      # a full backup (database + files) every day, into ./backups below;
      # Settings > Backups in the chat shows them (BACKUPS.md)
      BACKUP_DIR: /backups
      # group calls and voice channels go through the media server below
      # (reached at the "turn" container, whose network it shares); remove
      # these two lines to go back to direct calls (8 people max)
      LIVEKIT_URL: http://turn:7880
      LIVEKIT_KEY_FILE: /shared/livekit-keys.yaml
    volumes:
      - chat-code:/app
      - chat-files:/data
      - turn-shared:/shared
      # the backups, as a normal folder next to this project. Better: a folder
      # on ANOTHER disk or a USB drive, e.g. /volume2/chat-backups:/backups
      # (change the left side here AND in the import service above), and copy
      # it off the NAS too - see BACKUPS.md
      - ./backups:/backups
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        [ -s /shared/turn-secret ] || head -c 32 /dev/urandom | base64 > /shared/turn-secret
        chmod 644 /shared/turn-secret
        # the media server's login, made once ("key: secret", only root can read it)
        [ -s /shared/livekit-keys.yaml ] || echo "chat: $$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 48)" > /shared/livekit-keys.yaml
        chmod 600 /shared/livekit-keys.yaml
        # newest commit on main (empty if GitHub can't be reached)
        SHA=$$(wget -qO- --header "Accept: application/vnd.github.sha" "https://api.github.com/repos/$$CODE_REPO/commits/main" 2>/dev/null || true)
        if [ -n "$$SHA" ] && [ "$$SHA" = "$$(cat /app/.version 2>/dev/null)" ] && [ -d /app/node_modules ]; then
          echo "Already on $$SHA"
        elif wget -qO /tmp/code.tgz "https://codeload.github.com/$$CODE_REPO/tar.gz/$${SHA:-refs/heads/main}"; then
          rm -rf /tmp/code && mkdir -p /tmp/code
          tar xzf /tmp/code.tgz -C /tmp/code --strip-components=1
          # only reinstall packages when they changed (saves most of a restart)
          FRESH=1
          if [ -d /app/node_modules ] && cmp -s /tmp/code/package-lock.json /app/package-lock.json; then FRESH=0; fi
          cp -r /tmp/code/. /app/
          if [ "$$FRESH" = 1 ]; then npm ci --omit=dev --no-audit --no-fund --loglevel=error; fi
          if [ -n "$$SHA" ]; then echo "$$SHA" > /app/.version; else rm -f /app/.version; fi
          echo "Updated to $${SHA:-latest}"
        elif [ ! -f /app/server.js ]; then
          echo "Could not download the app."; exit 1
        fi
        exec node server.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 180s

  # The Discord bridge: links #cross-platform here with #cross-platform on
  # your Discord server (DISCORD_BRIDGE.md). Runs the chat's own code (the
  # shared code volume, read-only), talks to the chat inside the NAS, and
  # restarts onto new code when the chat updates. Off while the two settings
  # at the top are empty. Only run ONE bridge: remove DISCORD_BOT_TOKEN from
  # Render if it's set there, or messages show up twice.
  bridge:
    image: node:22-alpine
    container_name: chat-bridge
    restart: unless-stopped
    depends_on:
      chat:
        condition: service_healthy
    environment:
      DISCORD_BOT_TOKEN: *discord_token
      DISCORDS_BRIDGE_KEY: *bridge_key
      # optional: your Discord server's ID, if the bot is in more than one
      DISCORD_GUILD_ID: ""
      CHAT_URL: http://chat:3000
      # where pictures/files in bridged messages link to (a public address)
      PUBLIC_URL: https://discords-zf2n.onrender.com
      VERSION_FILE: /app/.version
    volumes:
      - chat-code:/app:ro
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$DISCORD_BOT_TOKEN" ] || [ -z "$$DISCORDS_BRIDGE_KEY" ]; then
          echo "[bridge] off - fill in discord-bot-token and discords-bridge-key at the top of the file to turn it on"
          exec sleep 2147483647
        fi
        until [ -f /app/bridge.js ]; do echo "[bridge] waiting for the chat's code"; sleep 10; done
        exec node bridge.js

  # TURN relay for calls when two people can't connect directly. Reached
  # through Funnel on port 8443 (TLS ends there), so no router changes. It
  # may only relay between callers, never into your home network.
  turn:
    image: coturn/coturn:latest
    container_name: chat-turn
    restart: unless-stopped
    user: root
    depends_on:
      - chat
    volumes:
      - turn-shared:/shared:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while [ ! -s /shared/turn-secret ]; do sleep 2; done
        SELF=$$(hostname -i | awk '{print $$1}')
        exec turnserver -n --log-file=stdout --no-cli --no-tls --no-dtls --listening-port=3478 \
          --fingerprint --use-auth-secret --static-auth-secret="$$(cat /shared/turn-secret)" --realm=chat \
          --min-port=49160 --max-port=49260 --no-multicast-peers --total-quota=120 --max-bps=8000000 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --allowed-peer-ip=$$SELF

  # Media server (LiveKit) for group calls and voice channels: everyone sends
  # their voice/video once and it forwards it to the others, so calls stay
  # smooth with 10-25 people. It shares the call relay's network, so the relay
  # (which may only relay to itself) carries callers to it - no new ports or
  # router changes. Browsers reach its setup connection through the chat at
  # /livekit; only the chat hands out (10-minute) logins for it.
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: chat-livekit
    restart: unless-stopped
    network_mode: "service:turn"
    depends_on:
      - turn
    volumes:
      - turn-shared:/shared:ro
    command: ["--key-file", "/shared/livekit-keys.yaml"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        room:
          empty_timeout: 60
          max_participants: 30
        logging:
          level: warn

  # Publishes the chat (443) and the call relay (8443) with Tailscale Funnel.
  funnel:
    image: tailscale/tailscale:latest
    container_name: chat-funnel
    hostname: discord
    restart: unless-stopped
    depends_on:
      - chat
    environment:
      TS_AUTHKEY: *ts_key
      TS_HOSTNAME: discord
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - funnel-state:/var/lib/tailscale
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /config
        cat > /config/serve.json <<'JSON'
        {"TCP":{"443":{"HTTPS":true},"8443":{"TCPForward":"turn:3478","TerminateTLS":"$${TS_CERT_DOMAIN}"}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://chat:3000"}}}},"AllowFunnel":{"$${TS_CERT_DOMAIN}:443":true,"$${TS_CERT_DOMAIN}:8443":true}}
        JSON
        exec /usr/local/bin/containerboot

volumes:
  chat-db:
  chat-code:
  chat-files:
  funnel-state:
  turn-shared:
