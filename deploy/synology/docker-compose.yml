# The chat app on a NAS (Synology, UGREEN or any Docker host), next to the
# Postgres you already run.
# Fill in .env first (copy .env.example), then from this folder:
#   sudo docker compose up -d --build
# See README.md in this folder for the whole move.
name: chat

services:
  chat:
    build: ../..
    image: chat-app:latest
    container_name: chat
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the app reach Postgres on the NAS
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-host.docker.internal}:${DB_PORT:-55432}/${DB_NAME:-chat}"
      PGSSL: "false"            # the database is on this same machine
      KEEP_FILE_MB: "${KEEP_FILE_MB:-25}"
      MEDIA_BUDGET_MB: "${MEDIA_BUDGET_MB:-40000}"
      FILE_EXPIRY_HOURS: "${FILE_EXPIRY_HOURS:-720}"
    volumes:
      - chat-files:/data

  # Reach the chat from anywhere with HTTPS, without opening router ports.
  # Only starts with:  sudo docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: chat-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    depends_on:
      - chat

  # Free alternative to the tunnel above: Tailscale Funnel gives the chat a
  # public https://<FUNNEL_NAME>.<your-tailnet>.ts.net address. No domain, no router
  # ports, and visitors don't need Tailscale. Only starts with:
  #   sudo docker compose --profile funnel up -d
  funnel:
    image: tailscale/tailscale:latest
    container_name: chat-funnel
    hostname: "${FUNNEL_NAME:-chat}"   # the first part of the address: <this>.<tailnet>.ts.net
    restart: unless-stopped
    profiles: ["funnel"]
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - funnel-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - chat

volumes:
  chat-files:
  funnel-state:
