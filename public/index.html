<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>

<link rel="icon" type="image/png" href="/google.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{height:100vh;background:#313338;color:white;overflow:hidden;}
#loginScreen{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:350px;max-width:calc(100vw - 30px);background:#232428;padding:25px;border-radius:12px;}
#loginScreen h2{margin-bottom:15px;}
input{width:100%;padding:12px;margin-bottom:10px;background:#1e1f22;border:none;color:white;border-radius:6px;outline:none;}
button{padding:10px;border:none;cursor:pointer;border-radius:6px;}
button:disabled{opacity:.55;cursor:not-allowed;}
.loginBtn{width:100%;background:#5865F2;color:white;margin-bottom:8px;}
.registerBtn{width:100%;background:#3BA55C;color:white;}
#status{margin-top:10px;color:#ccc;min-height:20px;}
#app{display:none;height:100vh;}
#servers{width:72px;background:#1e1f22;padding:10px;}
.server{width:48px;height:48px;background:#5865F2;border-radius:50%;margin-bottom:10px;}
#channels{width:250px;background:#2b2d31;padding:10px;overflow-y:auto;}
.sectionTitle{font-size:14px;color:#b5bac1;margin:12px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.channel{padding:10px;cursor:pointer;border-radius:6px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.channel:hover{background:#404249;}
.channel.active{background:#5865F2;}
.channelName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge,.dmBadge,.groupBadge{background:red;color:white;font-size:12px;padding:2px 6px;border-radius:10px;display:none;min-width:20px;text-align:center;}
#chat{flex:1;display:flex;flex-direction:column;min-width:0;}
#chatHeader{height:44px;background:#383a40;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #24262b;}
#roomTitle{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#messages{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:#2b2d31 transparent;}
#messages::-webkit-scrollbar{width:8px;}
#messages::-webkit-scrollbar-track{background:transparent;}
#messages::-webkit-scrollbar-thumb{background:#2b2d31;border-radius:6px;}
.message{margin-bottom:12px;padding:10px;background:#2b2d31;border-radius:8px;max-width:100%;word-wrap:break-word;}
.messageHeader{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.messageText{white-space:pre-wrap;}
.timeText{font-size:11px;color:#949ba4;}
.dmTag,.groupTag{color:white;font-size:11px;padding:2px 6px;border-radius:999px;}
.dmTag{background:#f23f43;}.groupTag{background:#3BA55C;}
.miniBtn{padding:6px 8px;background:#404249;color:white;font-size:12px;border-radius:6px;}
.miniBtn:hover{background:#4f535c;}
.primaryMiniBtn{padding:6px 8px;background:#5865F2;color:white;font-size:12px;border-radius:6px;}
#typingIndicator{min-height:22px;padding:0 20px 8px 20px;color:#b5bac1;font-size:13px;}
#inputArea{display:flex;padding:10px;background:#383a40;gap:8px;}
#fileInput{display:none;}
#uploadBarContainer{width:100%;height:6px;background:#2b2d31;overflow:hidden;}
#uploadBar{height:100%;width:0%;background:#5865F2;transition:width .2s;}
#messageInput{flex:1;margin-bottom:0;}
#users{width:240px;background:#232428;padding:10px;overflow-y:auto;}
#memberHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;}
#memberList{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.userItem{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#2b2d31;border-radius:6px;cursor:pointer;}
.userItem:hover{background:#404249;}
.userItem.active{background:#5865F2;}
.userName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.userControls{display:flex;align-items:center;gap:6px;}
#contextMenu{position:fixed;display:none;background:#1e1f22;border:1px solid #5865F2;border-radius:8px;padding:6px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.35);}
.contextItem{padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;}
.contextItem:hover{background:#404249;}
#debugMenu{position:fixed;top:60px;right:20px;background:#1e1f22;padding:15px;border:2px solid #5865F2;border-radius:10px;display:none;z-index:9999;}
#debugMenu button{width:100%;margin-top:5px;}
.fileBox{margin-top:8px;padding:8px 10px;background:#1e1f22;border-radius:6px;}
.fileBox img{max-width:220px;max-height:220px;border-radius:6px;display:block;margin-top:6px;object-fit:contain;}
.fileLink{color:#7aa2ff;text-decoration:none;display:inline-block;margin-top:6px;}
.errorLine{color:#ffb4b4;font-size:13px;padding:0 10px 8px 10px;}
@media (max-width:850px){#servers{display:none;}#channels{width:160px;}#users{display:none;}#loginScreen{width:330px;}}
</style>
</head>

<body>
<div id="loginScreen">
  <h2>Chat Platform</h2>
  <input id="username" placeholder="Username" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button class="loginBtn" onclick="login()">Login</button>
  <button class="registerBtn" onclick="registerUser()">Create Account</button>
  <div id="status"></div>
</div>

<div id="app">
  <div id="servers"><div class="server"></div><div class="server"></div><div class="server"></div></div>

  <div id="channels">
    <div class="sectionTitle"><span>Channels</span></div>
    <div class="channel active" data-room="general" onclick="joinRoom('general')"><span class="channelName"># general</span><span class="badge" id="badge-general"></span></div>
    <div class="channel" data-room="gaming" onclick="joinRoom('gaming')"><span class="channelName"># gaming</span><span class="badge" id="badge-gaming"></span></div>
    <div class="channel" data-room="coding" onclick="joinRoom('coding')"><span class="channelName"># coding</span><span class="badge" id="badge-coding"></span></div>

    <div class="sectionTitle"><span>Group Chats</span></div>
    <div id="groupList"></div>
  </div>

  <div id="chat">
    <div id="chatHeader"><div id="roomTitle"># general</div><button class="miniBtn" onclick="logout()">Logout</button></div>
    <div id="messages"></div>
    <div id="typingIndicator"></div>
    <div id="inputArea">
      <input type="file" id="fileInput">
      <button onclick="document.getElementById('fileInput').click()">📎</button>
      <input id="messageInput" placeholder="Message" maxlength="4000">
      <button onclick="sendMessage()">Send</button>
    </div>
    <div id="uploadBarContainer"><div id="uploadBar"></div></div>
  </div>

  <div id="users">
    <div id="memberHeader"><h3>Members</h3><button class="primaryMiniBtn" onclick="createGroupChat()">+ Group</button></div>
    <div id="memberList"></div>
  </div>
</div>

<div id="contextMenu"><div class="contextItem" id="contextDmItem">Message</div></div>

<div id="debugMenu">
  <h3>Debug Menu</h3>
  <button onclick="location.reload()">Reload</button>
  <button onclick="console.clear()">Clear Console</button>
  <button onclick="alert(socket && socket.id ? socket.id : 'Not connected')">Socket ID</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let currentRoom = 'general';
let username = '';
let token = '';
let isFocused = true;
let unreadChannels = { general:0, gaming:0, coding:0 };
let unreadDMs = {};
let unreadGroups = {};
let groups = [];
let groupByRoom = {};
let onlineUserList = [];
let typingTimer = null;
let isTyping = false;
let activeDMUser = '';
let currentGroupRoom = '';
let selectedContextUser = '';
let tabAlertTimer = null;
let tabAlertState = false;
const defaultTitle = document.title;
const faviconLink = document.querySelector("link[rel='icon']");
const defaultFavicon = faviconLink ? faviconLink.getAttribute('href') : '';
const alertFavicon = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#f23f43"/><text x="50" y="63" font-size="58" text-anchor="middle" fill="white" font-family="Arial">!</text></svg>`);

window.addEventListener('focus', () => { isFocused = true; stopTabAlert(); });
window.addEventListener('blur', () => { isFocused = false; });
document.addEventListener('click', hideContextMenu);
window.addEventListener('resize', hideContextMenu);

function setStatus(text){ document.getElementById('status').innerText = text || ''; }
function authHeaders(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token }; }
function roomNameForDM(a,b){ return 'dm:' + [a,b].sort().join(':'); }
function notifyTab(label){ if(!isFocused) startTabAlert(label || 'NEW MESSAGE'); }

async function registerUser(){
  username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  setStatus('Creating account...');
  try{
    const response = await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'register failed');
    completeLogin(data.username,data.token);
  }catch(err){ setStatus(err.message); }
}

async function login(){
  username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  setStatus('Logging in...');
  try{
    const response = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'login failed');
    completeLogin(data.username,data.token);
  }catch(err){ setStatus(err.message); }
}

function completeLogin(returnedUsername, returnedToken){
  username = returnedUsername;
  token = returnedToken;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  connectSocket();
}

async function logout(){
  try{ if(token) await fetch('/logout',{method:'POST',headers:authHeaders(),body:'{}'}); }catch(e){}
  if(socket) socket.disconnect();
  token=''; username=''; activeDMUser=''; currentGroupRoom=''; currentRoom='general'; groups=[]; groupByRoom={};
  stopTabAlert();
  document.getElementById('messages').innerHTML='';
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='block';
  setStatus('Logged out');
}

function connectSocket(){
  socket = io({ auth:{ token } });

  socket.on('connect', async () => {
    await loadGroups();
    joinRoom('general');
  });
  socket.on('connect_error', err => setStatus(err.message || 'socket connection failed'));
  socket.on('users', users => renderUsers(users));
  socket.on('groupsChanged', async () => { await loadGroups(); });

  socket.on('message', msg => {
    if(msg.room === currentRoom && !activeDMUser){
      addMessage(msg);
    }else if(isGroupRoom(msg.room)){
      unreadGroups[msg.room] = (unreadGroups[msg.room] || 0) + 1;
      updateGroupBadges();
      notifyTab('@ ' + (groupByRoom[msg.room]?.name || 'group'));
    }else if(unreadChannels[msg.room] !== undefined){
      unreadChannels[msg.room] += 1;
      updateChannelBadges();
      notifyTab('# ' + msg.room);
    }
  });

  socket.on('dmMessage', msg => {
    const otherUser = msg.user === username ? msg.to : msg.user;
    if(activeDMUser && otherUser === activeDMUser){
      addMessage(msg);
    }else{
      unreadDMs[otherUser] = (unreadDMs[otherUser] || 0) + 1;
      updateDMBadges();
      notifyTab('@ ' + otherUser);
    }
  });

  socket.on('file', msg => {
    if(msg.room === currentRoom && !activeDMUser){
      addFileMessage(msg);
    }else if(isGroupRoom(msg.room)){
      unreadGroups[msg.room] = (unreadGroups[msg.room] || 0) + 1;
      updateGroupBadges();
      notifyTab('@ ' + (groupByRoom[msg.room]?.name || 'group'));
    }else if(unreadChannels[msg.room] !== undefined){
      unreadChannels[msg.room] += 1;
      updateChannelBadges();
      notifyTab('# ' + msg.room);
    }
  });

  socket.on('dmFile', msg => {
    const otherUser = msg.user === username ? msg.to : msg.user;
    if(activeDMUser && otherUser === activeDMUser){
      addFileMessage(msg);
    }else{
      unreadDMs[otherUser] = (unreadDMs[otherUser] || 0) + 1;
      updateDMBadges();
      notifyTab('@ ' + otherUser);
    }
  });

  socket.on('typing', data => {
    if(data.user === username) return;
    const sameRoom = data.room && data.room === currentRoom && !activeDMUser;
    const sameDM = activeDMUser && data.user === activeDMUser;
    if(sameRoom || sameDM) document.getElementById('typingIndicator').innerText = data.user + ' is typing...';
  });

  socket.on('stopTyping', data => {
    if(data.user === username) return;
    const sameRoom = data.room && data.room === currentRoom && !activeDMUser;
    const sameDM = activeDMUser && data.user === activeDMUser;
    if(sameRoom || sameDM) document.getElementById('typingIndicator').innerText = '';
  });
}

function isGroupRoom(room){ return /^group:\d+$/.test(String(room || '')); }
function groupLabel(room){ return groupByRoom[room] ? groupByRoom[room].name : room; }

async function loadGroups(){
  if(!token) return;
  try{
    const response = await fetch('/groups',{headers:{'Authorization':'Bearer ' + token}});
    if(!response.ok) return;
    groups = await response.json();
    groupByRoom = {};
    groups.forEach(g => groupByRoom[g.room] = g);
    renderGroups();
  }catch(e){}
}

function renderGroups(){
  const list = document.getElementById('groupList');
  list.innerHTML = '';
  if(!groups.length){
    const empty = document.createElement('div');
    empty.style.color = '#949ba4';
    empty.style.fontSize = '13px';
    empty.style.padding = '8px 10px';
    empty.textContent = 'No groups yet';
    list.appendChild(empty);
    return;
  }

  groups.forEach(group => {
    const item = document.createElement('div');
    item.className = 'channel';
    item.dataset.room = group.room;
    item.onclick = () => openGroup(group.room);

    const name = document.createElement('span');
    name.className = 'channelName';
    name.textContent = '@ ' + group.name;

    const badge = document.createElement('span');
    badge.className = 'groupBadge';
    badge.id = 'group-badge-' + group.room.replace(':','-');

    item.appendChild(name);
    item.appendChild(badge);
    list.appendChild(item);
  });
  updateGroupBadges();
  highlightActiveRoom();
}

async function createGroupChat(){
  if(!token) return;
  const name = prompt('Group chat name:');
  if(!name) return;

  const examples = onlineUserList.filter(u => u !== username).join(', ');
  const memberText = prompt('Add usernames separated by commas. Example: ' + (examples || 'William, Sam'));
  if(!memberText) return;

  const members = memberText.split(',').map(x => x.trim()).filter(Boolean);
  try{
    const response = await fetch('/groups',{
      method:'POST',
      headers:authHeaders(),
      body:JSON.stringify({ name, members })
    });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'could not create group');
    await loadGroups();
    openGroup(data.room);
  }catch(err){ showError(err.message); }
}

function joinRoom(room){
  if(!socket || !socket.connected) return;
  currentRoom = room; activeDMUser = ''; currentGroupRoom = '';
  clearChat('# ' + room);
  socket.emit('joinRoom', room, result => {
    if(result && result.error){ showError(result.error); return; }
    unreadChannels[room] = 0;
    updateChannelBadges();
    loadHistory(room);
  });
}

function openGroup(room){
  if(!socket || !socket.connected || !room) return;
  currentRoom = room; activeDMUser = ''; currentGroupRoom = room;
  clearChat('@ ' + groupLabel(room));
  socket.emit('joinRoom', room, result => {
    if(result && result.error){ showError(result.error); return; }
    unreadGroups[room] = 0;
    updateGroupBadges();
    loadHistory(room);
  });
}

function openDM(user){
  if(!socket || !socket.connected || !user) return;
  activeDMUser = user; currentGroupRoom = ''; currentRoom = roomNameForDM(username,user);
  clearChat('@ ' + user);
  highlightActiveUser(user);
  unreadDMs[user] = 0;
  updateDMBadges();
  socket.emit('joinRoom', currentRoom, result => {
    if(result && result.error){ showError(result.error); return; }
    loadHistory(currentRoom);
  });
}

function clearChat(title){
  stopTyping();
  document.getElementById('messages').innerHTML = '';
  document.getElementById('typingIndicator').innerText = '';
  document.getElementById('roomTitle').innerText = title;
  highlightActiveRoom();
  if(!activeDMUser) highlightActiveUser('');
}

function highlightActiveRoom(){
  document.querySelectorAll('.channel').forEach(el => el.classList.toggle('active', el.dataset.room === currentRoom));
}

async function loadHistory(room){
  try{
    const [messagesRes, filesRes] = await Promise.all([
      fetch('/messages?room=' + encodeURIComponent(room), { headers:{ 'Authorization':'Bearer ' + token } }),
      fetch('/files?room=' + encodeURIComponent(room), { headers:{ 'Authorization':'Bearer ' + token } })
    ]);
    if(!messagesRes.ok) throw new Error('Could not load messages');
    const messages = await messagesRes.json();
    const files = filesRes.ok ? await filesRes.json() : [];
    const combined = [
      ...messages.map(item => ({ type:'message', data:item, time:item.createdAt, id:item.id })),
      ...files.map(item => ({ type:'file', data:item, time:item.createdAt, id:item.id }))
    ];
    combined.sort((a,b) => new Date(String(a.time).replace(' ','T') + 'Z') - new Date(String(b.time).replace(' ','T') + 'Z') || a.id - b.id);
    combined.forEach(item => item.type === 'message' ? addMessage(item.data) : addFileMessage(item.data));
  }catch(err){ showError(err.message); }
}

function showError(text){
  const div = document.createElement('div');
  div.className = 'errorLine';
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollMessages();
}

function addMessage(msg){
  const div = document.createElement('div');
  div.className = 'message';
  const header = document.createElement('div');
  header.className = 'messageHeader';

  const name = document.createElement('b');
  name.textContent = msg.user || 'unknown';
  header.appendChild(name);

  if(msg.dmTo){ const tag = document.createElement('span'); tag.className = 'dmTag'; tag.textContent = 'DM'; header.appendChild(tag); }
  if(msg.isGroup){ const tag = document.createElement('span'); tag.className = 'groupTag'; tag.textContent = 'GROUP'; header.appendChild(tag); }

  const time = document.createElement('span');
  time.className = 'timeText';
  time.textContent = formatTime(msg.createdAt);
  header.appendChild(time);
  div.appendChild(header);

  const body = document.createElement('div');
  body.className = 'messageText';
  body.textContent = msg.text || '';
  div.appendChild(body);
  document.getElementById('messages').appendChild(div);
  scrollMessages();
}

function addFileMessage(msg){
  const div = document.createElement('div');
  div.className = 'message';
  const header = document.createElement('div');
  header.className = 'messageHeader';

  const name = document.createElement('b');
  name.textContent = msg.user || 'unknown';
  header.appendChild(name);
  if(msg.dmTo){ const tag = document.createElement('span'); tag.className = 'dmTag'; tag.textContent = 'DM'; header.appendChild(tag); }
  if(msg.isGroup){ const tag = document.createElement('span'); tag.className = 'groupTag'; tag.textContent = 'GROUP'; header.appendChild(tag); }
  header.appendChild(document.createTextNode('📎 file'));

  const time = document.createElement('span');
  time.className = 'timeText';
  time.textContent = formatTime(msg.createdAt);
  header.appendChild(time);
  div.appendChild(header);

  const box = document.createElement('div');
  box.className = 'fileBox';
  if(msg.fileType && msg.fileType.startsWith('image/')){
    const img = document.createElement('img');
    img.src = msg.fileUrl;
    img.alt = msg.fileName || 'image';
    box.appendChild(img);
  }
  const link = document.createElement('a');
  link.href = msg.fileUrl;
  link.download = msg.fileName || 'file';
  link.textContent = 'Download ' + (msg.fileName || 'file');
  link.className = 'fileLink';
  box.appendChild(link);
  div.appendChild(box);
  document.getElementById('messages').appendChild(div);
  scrollMessages();
}

function scrollMessages(){
  const messages = document.getElementById('messages');
  messages.scrollTop = messages.scrollHeight;
}

function formatTime(value){
  if(!value) return '';
  const d = new Date(String(value).replace(' ', 'T') + 'Z');
  if(isNaN(d)) return value;
  return d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }).replace(' ', '').toLowerCase();
}

function sendMessage(){
  if(!socket || !socket.connected) return;
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if(!text) return;

  if(activeDMUser){
    socket.emit('dmMessage', { text, to:activeDMUser }, handleAck);
  }else{
    socket.emit('message', { text, room:currentRoom }, handleAck);
  }
  input.value = '';
  input.focus();
  stopTyping();
  document.getElementById('typingIndicator').innerText = '';
}

function handleAck(result){ if(result && result.error) showError(result.error); }

const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', async e => {
  const file = e.target.files[0];
  if(!file) return;
  await uploadFile(file);
  e.target.value = '';
});

function uploadFile(file){
  return new Promise(resolve => {
    const maxFileBytes = 10 * 1024 * 1024 * 1024; // 10GB
    if(file.size > maxFileBytes){
      showError('File is too large. Maximum is 10GB.');
      resolve();
      return;
    }

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('X-Room', currentRoom);
    xhr.setRequestHeader('X-File-Name', encodeURIComponent(file.name));
    xhr.setRequestHeader('X-File-Type', file.type || 'application/octet-stream');
    if(activeDMUser) xhr.setRequestHeader('X-To-User', activeDMUser);

    xhr.upload.onprogress = e => {
      if(e.lengthComputable){
        document.getElementById('uploadBar').style.width = ((e.loaded / e.total) * 100) + '%';
      }
    };

    xhr.onload = () => {
      document.getElementById('uploadBar').style.width = '100%';
      if(xhr.status < 200 || xhr.status >= 300){
        try{
          const data = JSON.parse(xhr.responseText || '{}');
          showError(data.error || 'Upload failed.');
        }catch(e){
          showError('Upload failed.');
        }
      }
      setTimeout(() => document.getElementById('uploadBar').style.width = '0%', 400);
      resolve();
    };

    xhr.onerror = () => {
      showError('Upload failed. Check the file size, connection, and Render limits.');
      document.getElementById('uploadBar').style.width = '0%';
      resolve();
    };

    xhr.send(file);
  });
}

function renderUsers(users){
  onlineUserList = Array.isArray(users) ? users : [];
  const list = document.getElementById('memberList');
  list.innerHTML = '';
  onlineUserList.filter(user => user && user !== username).forEach(user => {
    const item = document.createElement('div');
    item.className = 'userItem';
    item.dataset.user = user;

    const name = document.createElement('div');
    name.className = 'userName';
    name.textContent = user;

    const controls = document.createElement('div');
    controls.className = 'userControls';
    const badge = document.createElement('span');
    badge.className = 'dmBadge';
    badge.id = 'dm-badge-' + user;
    controls.appendChild(badge);

    item.appendChild(name);
    item.appendChild(controls);
    item.onclick = () => openDM(user);
    item.oncontextmenu = e => showContextMenu(e, user);
    name.oncontextmenu = e => showContextMenu(e, user);
    list.appendChild(item);
  });
  highlightActiveUser(activeDMUser);
  updateDMBadges();
}

function showContextMenu(e, user){
  e.preventDefault();
  e.stopPropagation();
  selectedContextUser = user;
  const menu = document.getElementById('contextMenu');
  menu.style.left = Math.min(e.clientX, window.innerWidth - 140) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 60) + 'px';
  menu.style.display = 'block';
}
function hideContextMenu(){ document.getElementById('contextMenu').style.display = 'none'; }
document.getElementById('contextDmItem').addEventListener('click', e => { e.stopPropagation(); if(selectedContextUser) openDM(selectedContextUser); hideContextMenu(); });

function highlightActiveUser(user){
  document.querySelectorAll('.userItem').forEach(el => el.classList.toggle('active', el.dataset.user === user));
}

function updateChannelBadges(){
  for(const room in unreadChannels){
    const badge = document.getElementById('badge-' + room);
    if(!badge) continue;
    const count = unreadChannels[room];
    badge.style.display = count > 0 ? 'inline-block' : 'none';
    badge.innerText = count > 0 ? count : '';
  }
}
function updateDMBadges(){
  Object.keys(unreadDMs).forEach(user => {
    const badge = document.getElementById('dm-badge-' + user);
    if(!badge) return;
    const count = unreadDMs[user];
    badge.style.display = count > 0 ? 'inline-block' : 'none';
    badge.innerText = count > 0 ? count : '';
  });
}
function updateGroupBadges(){
  Object.keys(unreadGroups).forEach(room => {
    const badge = document.getElementById('group-badge-' + room.replace(':','-'));
    if(!badge) return;
    const count = unreadGroups[room];
    badge.style.display = count > 0 ? 'inline-block' : 'none';
    badge.innerText = count > 0 ? count : '';
  });
}

function startTabAlert(label){
  if(tabAlertTimer) return;
  const text = label || 'NEW MESSAGE';
  tabAlertTimer = setInterval(() => {
    tabAlertState = !tabAlertState;
    document.title = tabAlertState ? '🔴 NEW MESSAGE' : text;
    updateFavicon(tabAlertState);
  }, 700);
}
function stopTabAlert(){
  if(tabAlertTimer) clearInterval(tabAlertTimer);
  tabAlertTimer = null;
  tabAlertState = false;
  document.title = defaultTitle;
  updateFavicon(false);
}
function updateFavicon(hasUnread){
  if(!faviconLink) return;
  faviconLink.href = hasUnread ? alertFavicon : defaultFavicon;
}

function sendTyping(){
  if(!socket || !socket.connected) return;
  const input = document.getElementById('messageInput');
  if(!input.value.trim()){ stopTyping(); return; }
  if(!isTyping){
    isTyping = true;
    socket.emit('typing', { room:currentRoom, to:activeDMUser || '' });
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 1000);
}
function stopTyping(){
  if(!isTyping || !socket) return;
  isTyping = false;
  clearTimeout(typingTimer);
  socket.emit('stopTyping', { room:currentRoom, to:activeDMUser || '' });
}

document.addEventListener('keydown', e => {
  if(e.key === '`'){
    const menu = document.getElementById('debugMenu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }
});
document.getElementById('messageInput').addEventListener('input', sendTyping);
document.getElementById('messageInput').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); } });
document.getElementById('password').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); login(); } });
window.addEventListener('beforeunload', stopTyping);
</script>
</body>
</html>
